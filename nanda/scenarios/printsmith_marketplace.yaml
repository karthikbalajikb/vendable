# SPDX-License-Identifier: Apache-2.0
# PrintSmith marketplace: buyer agents pay the PrintSmith merchant over the Prava rail.
# Same shape as the built-in `marketplace` scenario, but the payments layer is `prava`.
name: printsmith_marketplace
description: "Buyer agents purchase PrintSmith prints, settling agent-to-agent over Prava."

tier: 1
seed: 42

agents:
  count: 24
  brain: state-machine
  roles:
    - name: buyer
      count: 20
    - name: seller
      count: 4

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prava          # <-- Prava payments plugin (this project)
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: marketplace
  config:
    catalog_size: 12
    rounds: 5

failures:
  message_drop: 0.0

duration: "ticks: 5000"

metrics:
  - success_rate
  - mean_latency
  - message_count

output:
  trace: ./traces/printsmith_marketplace.jsonl
